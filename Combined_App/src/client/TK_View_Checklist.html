<!-- TK_View_Checklist.html -->
<div x-data="tkChecklistInput()" class="space-y-6">
    <!-- Header Selection Panel -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 border-b border-gray-100 pb-3">
            <h3 class="text-xl font-bold text-indigo-900">Penilaian Checklist Perkembangan PG-TK</h3>
            
            <!-- Quick Filter Bar -->
            <div class="flex items-center gap-2">
                <select x-model="filterKelas" class="p-2 border border-gray-200 rounded-xl text-xs bg-gray-50 font-semibold text-gray-700 outline-none">
                    <option value="">Semua Kelas</option>
                    <option value="Playgroup">Playgroup</option>
                    <option value="TK A">TK A</option>
                    <option value="TK B">TK B</option>
                </select>
                <select x-model="filterGuru" class="p-2 border border-gray-200 rounded-xl text-xs bg-gray-50 font-semibold text-gray-700 outline-none">
                    <option value="">Semua Guru Wali</option>
                    <template x-for="g in availableWaliList" :key="g">
                        <option :value="g" x-text="g"></option>
                    </template>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 pt-2">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Pilih Siswa</label>
                <select x-model="selectedNis" @change="loadRatings()" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 bg-gray-50 text-xs font-medium">
                    <option value="">-- Pilih Siswa (<span x-text="listSiswaFiltered.length"></span> siswa) --</option>
                    <template x-for="s in listSiswaFiltered" :key="s.nis">
                        <option :value="s.nis" x-text="s.nama_lengkap + ' — [' + (s.kelas_id || 'TK') + (s.wali_kelas ? ' • ' + s.wali_kelas : '') + ']'"></option>
                    </template>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Semester</label>
                <select x-model="semester" @change="loadRatings()" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 bg-gray-50">
                    <option value="1">Semester 1 (Satu)</option>
                    <option value="2">Semester 2 (Dua)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Kategori / Elemen</label>
                <select x-model="category" @change="loadIndicators()" class="w-full p-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 bg-gray-50">
                    <option value="Agama">Nilai Agama & Budi Pekerti</option>
                    <option value="Jati Diri">Jati Diri</option>
                    <option value="Literasi & STEAM">Dasar Literasi & STEAM</option>
                    <option value="Kokurikuler">Kokurikuler / Dimensi Profil Lulusan</option>
                    <option value="Diniyah">Laporan Perkembangan Diniyyah</option>
                    <option value="English">ESL English Program</option>
                    <option value="Math">Mathematic</option>
                    <option value="Science">Science</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Rating Grid / Indicators Panel -->
    <div x-show="selectedNis && category" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 min-h-[300px]" x-cloak>
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
            <h4 class="text-lg font-bold text-gray-800" x-text="'Indikator Perkembangan - ' + getCategoryLabel()"></h4>
            <div class="text-xs text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg font-semibold">
                Skala Penilaian: <span x-text="isEnglishMathScience() ? 'NI, G, E' : 'BB, MB, BSH, BSB'"></span>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div x-show="loading" class="flex flex-col items-center justify-center py-12 space-y-4">
            <div class="animate-spin h-10 w-10 border-4 border-indigo-600 border-t-transparent rounded-full"></div>
            <p class="text-sm text-gray-500 font-medium">Memuat indikator dan nilai...</p>
        </div>

        <!-- Table or List of Indicators -->
        <div x-show="!loading && listIndicators.length === 0" class="flex flex-col items-center justify-center py-12 text-gray-400 space-y-2">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
            <p class="text-sm font-medium">Belum ada indikator terdaftar untuk kategori ini di sheet TK_Master_IKTP.</p>
        </div>

        <div x-show="!loading && listIndicators.length > 0" class="space-y-4">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm border-collapse">
                    <thead>
                        <tr class="bg-gray-50 text-xs font-bold text-gray-500 uppercase border-b border-gray-200">
                            <th class="p-4 w-12">No</th>
                            <th class="p-4">Tujuan Pembelajaran / Indikator</th>
                            <th class="p-4 w-[320px] text-center">Skala Penilaian</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <template x-for="(item, index) in (listIndicators || []).filter(i => {
                            const sClass = getStudentClass();
                            if (!sClass) return true;
                            const itemKelas = i.kelas || i.tujuan_pembelajaran || '';
                            return !itemKelas || itemKelas.trim() === '' || sClass.toUpperCase().includes(itemKelas.toUpperCase());
                        })" :key="item.id_iktp">
                            <tr class="hover:bg-gray-50/50 transition-colors">
                                <td class="p-4 font-semibold text-gray-400" x-text="index + 1"></td>
                                <td class="p-4">
                                    <div class="font-bold text-gray-800 text-sm" x-text="item.indikator || item.id_iktp"></div>
                                    <div class="text-xs text-gray-400 mt-1" x-text="item.tujuan_pembelajaran || ''"></div>
                                </td>
                                <td class="p-4">
                                    <!-- 4 Scales (BB, MB, BSH, BSB) -->
                                    <template x-if="!isEnglishMathScience()">
                                        <div class="flex items-center justify-between bg-gray-50 p-1.5 rounded-xl border border-gray-200 text-xs font-bold w-full">
                                            <label class="flex-1 flex flex-col items-center justify-center p-1.5 rounded-lg cursor-pointer transition-all select-none"
                                                :class="ratings[item.id_iktp] === 'BB' ? 'bg-red-500 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-200/50'">
                                                <input type="radio" :name="item.id_iktp" value="BB" x-model="ratings[item.id_iktp]" class="hidden">
                                                <span>BB</span>
                                            </label>
                                            <label class="flex-1 flex flex-col items-center justify-center p-1.5 rounded-lg cursor-pointer transition-all select-none"
                                                :class="ratings[item.id_iktp] === 'MB' ? 'bg-amber-500 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-200/50'">
                                                <input type="radio" :name="item.id_iktp" value="MB" x-model="ratings[item.id_iktp]" class="hidden">
                                                <span>MB</span>
                                            </label>
                                            <label class="flex-1 flex flex-col items-center justify-center p-1.5 rounded-lg cursor-pointer transition-all select-none"
                                                :class="ratings[item.id_iktp] === 'BSH' ? 'bg-green-400 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-200/50'">
                                                <input type="radio" :name="item.id_iktp" value="BSH" x-model="ratings[item.id_iktp]" class="hidden">
                                                <span>BSH</span>
                                            </label>
                                            <label class="flex-1 flex flex-col items-center justify-center p-1.5 rounded-lg cursor-pointer transition-all select-none"
                                                :class="ratings[item.id_iktp] === 'BSB' ? 'bg-green-600 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-200/50'">
                                                <input type="radio" :name="item.id_iktp" value="BSB" x-model="ratings[item.id_iktp]" class="hidden">
                                                <span>BSB</span>
                                            </label>
                                        </div>
                                    </template>

                                    <!-- 3 Scales (NI, G, E) for subjects -->
                                    <template x-if="isEnglishMathScience()">
                                        <div class="flex items-center justify-between bg-gray-50 p-1.5 rounded-xl border border-gray-200 text-xs font-bold w-full">
                                            <label class="flex-1 flex flex-col items-center justify-center p-1.5 rounded-lg cursor-pointer transition-all select-none"
                                                :class="ratings[item.id_iktp] === 'NI' ? 'bg-orange-500 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-200/50'">
                                                <input type="radio" :name="item.id_iktp" value="NI" x-model="ratings[item.id_iktp]" class="hidden">
                                                <span>NI</span>
                                            </label>
                                            <label class="flex-1 flex flex-col items-center justify-center p-1.5 rounded-lg cursor-pointer transition-all select-none"
                                                :class="ratings[item.id_iktp] === 'G' ? 'bg-blue-500 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-200/50'">
                                                <input type="radio" :name="item.id_iktp" value="G" x-model="ratings[item.id_iktp]" class="hidden">
                                                <span>G</span>
                                            </label>
                                            <label class="flex-1 flex flex-col items-center justify-center p-1.5 rounded-lg cursor-pointer transition-all select-none"
                                                :class="ratings[item.id_iktp] === 'E' ? 'bg-green-600 text-white shadow-sm' : 'text-gray-500 hover:bg-gray-200/50'">
                                                <input type="radio" :name="item.id_iktp" value="E" x-model="ratings[item.id_iktp]" class="hidden">
                                                <span>E</span>
                                            </label>
                                        </div>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div x-show="!loading && listIndicators.length === 0" class="p-8 text-center text-gray-500">
                    <svg class="w-12 h-12 mx-auto text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    <p class="text-sm font-medium">Belum ada indikator terdaftar untuk kategori ini di sheet TK_Master_IKTP.</p>
                </div>
            </div>

            <!-- Bottom Action -->
            <div x-show="listIndicators.length > 0" class="mt-6 flex justify-end no-print">
                <button @click="saveRatings" :disabled="saving"
                    class="bg-indigo-600 text-white px-6 py-2.5 rounded-xl font-bold hover:bg-indigo-700 transition-all flex items-center gap-2">
                    <span x-show="!saving">Simpan Penilaian</span>
                    <svg x-show="saving" class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function tkChecklistInput() {
        return {
            listSiswa: [],
            listIndicators: [],
            selectedNis: '',
            semester: '1',
            category: 'Agama',
            filterKelas: '',
            filterGuru: '',
            ratings: {}, // Map of id_iktp -> rating (e.g., 'BB', 'MB', 'BSH', 'BSB', 'NI', 'G', 'E')
            loading: false,
            saving: false,

            defaultTeachers: [
                'Bu Nurlaela',
                'Ustadzah Nur Hikmah',
                'Ustadzah Halizah',
                'Ustadzah Muttia Ghina',
                'Ustadzah Dian',
                'Ustadzah Sahla'
            ],

            getStudentClass() {
                const s = this.listSiswa.find(x => x.nis === this.selectedNis);
                return s ? s.kelas_id : '';
            },

            init() {
                this.loadSiswa();
            },

            loadSiswa() {
                google.script.run.withSuccessHandler(res => {
                    this.listSiswa = res?.data || [];
                }).apiCall('getSiswa');
            },

            get availableWaliList() {
                const names = new Set();
                this.listSiswa.forEach(s => {
                    if (s.wali_kelas) names.add(s.wali_kelas);
                });
                this.defaultTeachers.forEach(t => names.add(t));
                return Array.from(names);
            },

            getAssignedWali(kelasId) {
                const c = (kelasId || '').toUpperCase();
                if (c.includes('PLAYGROUP') || c === 'PG') return 'Bu Nurlaela';
                if (c === 'TK A') return 'Ustadzah Dian / Sahla';
                if (c === 'TK B') return 'Ustadzah Nur Hikmah / Halizah / Muttia';
                return '';
            },

            get listSiswaFiltered() {
                return this.listSiswa.filter(s => {
                    if (this.filterKelas) {
                        const targetK = this.filterKelas.toUpperCase();
                        const sK = (s.kelas_id || '').toUpperCase();
                        if (targetK === 'PLAYGROUP' && !(sK.includes('PLAYGROUP') || sK === 'PG')) return false;
                        if (targetK !== 'PLAYGROUP' && !sK.includes(targetK)) return false;
                    }

                    if (this.filterGuru) {
                        const sWali = s.wali_kelas || this.getAssignedWali(s.kelas_id);
                        if (!sWali.toLowerCase().includes(this.filterGuru.toLowerCase())) return false;
                    }

                    return true;
                });
            },

            isEnglishMathScience() {
                return ['English', 'Math', 'Science'].includes(this.category);
            },

            getCategoryLabel() {
                const maps = {
                    'Agama': 'Nilai Agama & Budi Pekerti',
                    'Jati Diri': 'Jati Diri',
                    'Literasi & STEAM': 'Dasar Literasi & STEAM',
                    'Kokurikuler': 'Kokurikuler / Dimensi Profil Lulusan',
                    'Diniyah': 'Laporan Perkembangan Diniyyah',
                    'English': 'ESL English Program',
                    'Math': 'Mathematic',
                    'Science': 'Science'
                };
                return maps[this.category] || this.category;
            },

            loadIndicators() {
                if (!this.category) return;
                this.loading = true;
                this.listIndicators = [];
                google.script.run.withSuccessHandler(res => {
                    this.listIndicators = res?.data || [];
                    this.loadRatings();
                }).apiCall('getIKTP', JSON.stringify({ elemen: this.getCategoryLabel() }));
            },

            loadRatings() {
                if (!this.selectedNis || !this.semester || this.listIndicators.length === 0) {
                    this.loading = false;
                    return;
                }
                this.loading = true;
                google.script.run.withSuccessHandler(res => {
                    // Reset ratings
                    this.ratings = {};
                    
                    // Initialize with empty strings for all loaded indicators
                    this.listIndicators.forEach(item => {
                        this.ratings[item.id_iktp] = '';
                    });

                    // Populate with fetched ratings
                    if (res && res.data) {
                        res.data.forEach(row => {
                            if (this.ratings[row.id_iktp] !== undefined) {
                                this.ratings[row.id_iktp] = row.nilai;
                            }
                        });
                    }
                    this.loading = false;
                }).apiCall('getTK_Checklist', JSON.stringify({ nis: this.selectedNis, semester: this.semester }));
            },

            saveRatings() {
                if (!this.selectedNis) return alert("Pilih Siswa!");
                
                // Validate that at least some ratings are filled
                const ratingsToSave = {};
                let count = 0;
                Object.keys(this.ratings).forEach(idIktp => {
                    if (this.ratings[idIktp]) {
                        ratingsToSave[idIktp] = this.ratings[idIktp];
                        count++;
                    }
                });

                if (count === 0) {
                    return alert("Mohon berikan setidaknya satu penilaian skala perkembangan sebelum menyimpan.");
                }

                this.saving = true;
                google.script.run.withSuccessHandler(res => {
                    this.saving = false;
                    if (res && res.status) {
                        alert(`Berhasil menyimpan ${count} nilai perkembangan untuk kategori ${this.getCategoryLabel()}!`);
                        this.loadRatings();
                    } else {
                        alert("Gagal menyimpan: " + (res?.message || "Unknown error"));
                    }
                }).apiCall('saveTK_Checklist', JSON.stringify({
                    nis: this.selectedNis,
                    semester: this.semester,
                    category: this.category,
                    ratings: ratingsToSave
                }));
            }
        }
    }
</script>
