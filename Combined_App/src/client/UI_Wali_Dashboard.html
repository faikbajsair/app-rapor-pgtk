<!-- UI_Wali_Dashboard.html -->
<div class="space-y-6">
    <!-- Profile Card -->
    <div
        class="bg-indigo-900 text-white p-8 rounded-3xl shadow-xl flex flex-col md:flex-row justify-between items-center">
        <div>
            <h2 class="text-3xl font-bold mb-2">Ahlan wa Sahlan, Ayah/Bunda</h2>
            <p class="opacity-80">Laporan perkembangan Ananda <span class="font-bold underline"
                    x-text="user.nama"></span></p>
        </div>
        <div class="mt-4 md:mt-0 bg-white/20 px-6 py-3 rounded-2xl backdrop-blur-sm border border-white/20">
            <p class="text-xs uppercase font-bold opacity-60">Status Kehadiran</p>
            <p class="text-2xl font-bold">Teratur (98%)</p>
        </div>
    </div>

    <!-- Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- Info Akademik -->
        <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
            <h3 class="text-lg font-bold text-indigo-900 mb-6 flex items-center">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253">
                    </path>
                </svg>
                Ringkasan Perkembangan
            </h3>

            <div class="prose prose-indigo italic text-gray-600">
                "Ananda menunjukkan antusiasme yang luar biasa dalam kegiatan ibadah harian. Kemampuan bersosialisasi
                dengan teman sebaya juga meningkat secara signifikan..."
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm">
            <h3 class="text-lg font-bold text-indigo-900 mb-6">Aksi Cepat</h3>
            <div class="grid grid-cols-1 gap-4">
                <button @click="view = 'tk_out'"
                    class="bg-emerald-600 text-white px-6 py-4 rounded-xl font-bold hover:bg-emerald-700 transition-all flex items-center justify-between">
                    Dapatkan Rapor Digital (Print)
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z">
                        </path>
                    </svg>
                </button>

                <button @click="exportDocxWali(user)"
                    class="bg-blue-600 text-white px-6 py-4 rounded-xl font-bold hover:bg-blue-700 transition-all flex items-center justify-between">
                    Unduh Versi Editable (Word)
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>

    </div>
</div>

<script>
    function exportDocxWali(userData) {
        google.script.run.withSuccessHandler(url => window.open(url, '_blank'))
            .apiCall('exportDocx', JSON.stringify({ nis: userData.nis, nama: userData.nama, unit: userData.unit }));
    }
</script>
