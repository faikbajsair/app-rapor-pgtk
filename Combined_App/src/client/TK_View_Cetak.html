<style>
    /* Global Page Card Style (Screen & Print) */
    .page-container {
        width: 210mm;
        height: 297mm;
        padding: 25mm 20mm 38mm 20mm !important; /* Normal A4 margins: 25mm top/left/right, 38mm bottom safety margin */
        box-sizing: border-box !important;
        position: relative;
        background-color: white;
        overflow: hidden;
        margin: 0 auto 2rem auto;
        border: 1px solid #e2e8f0;
        box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .page-container:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    /* Table styles for dynamic scaling */
    .normal-table th, .normal-table td {
        padding: 4px 6px !important;
        font-size: 8.5px !important;
        line-height: 1.2 !important;
    }
    .normal-table .indicator-title {
        font-size: 9px !important;
        font-weight: bold !important;
        color: #1e293b;
    }

    .compact-table th, .compact-table td {
        padding: 2px 4px !important;
        font-size: 7px !important;
        line-height: 1.15 !important;
    }
    .compact-table .indicator-title {
        font-size: 7.5px !important;
        font-weight: bold !important;
        color: #1e293b;
    }

    @media print {
        @page {
            size: A4;
            margin: 0; /* Removes default browser header/footer and margins */
        }
        body {
            margin: 0;
            padding: 0;
            background: none;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .print-page-break {
            page-break-before: always;
            break-before: page;
        }
        .no-print {
            display: none !important;
        }
        .page-container {
            border: none !important;
            box-shadow: none !important;
            margin: 0 !important;
            background-color: white !important;
        }
    }
</style>
<div x-data="tkReportView()">

        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 border-b border-gray-100 pb-3">
            <h2 class="text-xl font-bold text-gray-800">Cetak Rapor PG-TK</h2>
            <div class="flex items-center gap-2">
                <select x-model="filterKelas" class="p-1.5 border border-gray-200 rounded-lg text-xs bg-gray-50 font-semibold text-gray-700 outline-none">
                    <option value="">Semua Kelas</option>
                    <option value="Playgroup">Playgroup</option>
                    <option value="TK A">TK A</option>
                    <option value="TK B">TK B</option>
                </select>

<script>
    if (typeof tkReportView === 'undefined') {
        function tkReportView() {
            return {
                listSiswa: [],
                searchNis: '',
                semester: '1',
                filterKelas: '',
                loading: false,
                reportReady: false,
                siswa: {},
                dataRapor: { narasi: [], checklist: [] },

                init() {
                    this.loadSiswa();
                },

                loadSiswa() {
                    google.script.run.withSuccessHandler(res => {
                        this.listSiswa = res?.data || [];
                    }).apiCall('getSiswa');
                },

                get listSiswaFiltered() {
                    return this.listSiswa.filter(s => {
                        if (this.filterKelas) {
                            const targetK = this.filterKelas.toUpperCase();
                            const sK = (s.kelas_id || '').toUpperCase();
                            if (targetK === 'PLAYGROUP' && !(sK.includes('PLAYGROUP') || sK === 'PG')) return false;
                            if (targetK !== 'PLAYGROUP' && !sK.includes(targetK)) return false;
                        }
                        return true;
                    });
                },

                getAssignedWali(kelasId) {
                    const c = (kelasId || '').toUpperCase();
                    if (c.includes('PLAYGROUP') || c === 'PG') return 'Bu Nurlaela';
                    if (c === 'TK A') return 'Ustadzah Dian / Sahla';
                    if (c === 'TK B') return 'Ustadzah Nur Hikmah / Halizah / Muttia';
                    return '-';
                },

                // Local inputs for narrative editor
                localNarratives: {},
                localPhotos: {},
                aiLoading: {},

                // Google Drive Direct Link Backgrounds (Placeholders)
                // Ganti 'MASUKKAN_ID_FILE_1_DISINI' dengan ID file gambar Anda dari Google Drive
                bgImages: [
                    'https://lh3.googleusercontent.com/d/1aeMhaJhIsROMLVZ-gu09P2FuGlwITGC2', // Gambar 1 (Toys / Mainan)
                    'https://lh3.googleusercontent.com/d/1MYyq5HOG9ZBVpdfXbb5xQQ-z2ngvHPtd', // Gambar 2 (Bricks / Balok)
                    'https://lh3.googleusercontent.com/d/1c-K0bZKt4eqQbbrF4d-SEQ91UNUn5hB9', // Gambar 3 (Pencils / Pensil)
                ],

                getBgStyle(idx) {
                    const bgUrl = this.bgImages[idx % this.bgImages.length];
                    if (bgUrl.includes('MASUKKAN_ID_FILE_')) {
                        return 'background-color: #ffffff;'; // Fallback ke warna putih jika belum diset
                    }
                    return `background-image: url('${bgUrl}'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center;`;
                },

                generatePreview() {
                    if (!this.searchNis) return alert("Pilih Siswa!");
                    this.loading = true;
                    google.script.run.withSuccessHandler(res => {
                        this.siswa = (res?.data || []).find(s => String(s.nis).trim() === String(this.searchNis).trim());
                        if (!this.siswa) return (alert("Siswa tidak ditemukan!"), this.loading = false);

                        google.script.run.withSuccessHandler(rep => {
                            this.dataRapor = rep.data;

                            // Initialize local narratives and photos
                            this.localNarratives = {};
                            this.localPhotos = {};
                            this.aiLoading = {};

                            ['Agama', 'Jati Diri', 'Literasi & STEAM', 'Kokurikuler', 'Diniyah', 'English', 'Math', 'Science'].forEach(cat => {
                                const fullLabel = this.getCategoryFullLabel(cat);
                                const existing = this.dataRapor.narasi.find(n => n.elemen === fullLabel);
                                this.localNarratives[cat] = existing ? existing.teks_narasi : 'Alhamdulillah, Ananda menunjukkan perkembangan yang baik pada elemen ini. Selengkapnya akan dibahas saat konsultasi orang tua.';
                                this.localPhotos[cat] = existing ? existing.foto_url : '';
                                this.aiLoading[cat] = false;
                            });

                            this.reportReady = true;
                            this.loading = false;
                        }).apiCall('getReportTK', JSON.stringify({ nis: this.searchNis, semester: this.semester }));
                    }).apiCall('getSiswa');
                },

                generateAINarrative(cat) {
                    this.aiLoading[cat] = true;
                    const fullLabel = this.getCategoryFullLabel(cat);

                    // Compile indicators and ratings
                    const listIndicators = this.getIndicatorsFor(cat);
                    const listRatings = listIndicators.map(i => ({
                        indikator: i.indikator || i.id_iktp,
                        nilai: this.getRating(i.id_iktp) || 'MB'
                    }));

                    google.script.run.withSuccessHandler(res => {
                        this.aiLoading[cat] = false;
                        if (res && res.status && res.data) {
                            this.localNarratives[cat] = res.data;
                            this.saveNarasi(cat);
                        } else {
                            alert("Gagal memproses AI: " + (res?.message || "Error"));
                        }
                    }).apiCall('genAI', JSON.stringify({
                        nama: this.siswa.nama_lengkap,
                        gender: this.siswa.jenis_kelamin,
                        elemen: fullLabel,
                        list_iktp: listRatings
                    }));
                },

                uploadPhoto(e, cat) {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (event) => {
                        google.script.run.withSuccessHandler(res => {
                            if (res && res.status && res.data && res.data.url) {
                                this.localPhotos[cat] = res.data.url;
                                this.saveNarasi(cat);
                            } else {
                                alert("Gagal mengunggah foto: " + (res?.message || "Error"));
                            }
                        }).apiCall('uploadFile', JSON.stringify({
                            base64: event.target.result,
                            fileName: `rapor_${this.searchNis}_${cat.replace(/\s+/g, '_')}_${file.name}`
                        }));
                    };
                    reader.readAsDataURL(file);
                },

                saveNarasi(cat) {
                    google.script.run.withSuccessHandler(res => {
                        // Success silently
                    }).apiCall('saveTK', JSON.stringify({
                        nis: this.searchNis,
                        semester: this.semester,
                        elemen: this.getCategoryFullLabel(cat),
                        teks_narasi: this.localNarratives[cat],
                        foto_url: this.localPhotos[cat]
                    }));
                },

                getCategoryTitle(cat) {
                    const maps = {
                        'Agama': 'NILAI AGAMA DAN BUDI PEKERTI',
                        'Jati Diri': 'JATI DIRI',
                        'Literasi & STEAM': 'DASAR LITERASI, MATEMATIKA, SAINS, TEKNOLOGI, REKAYASA, DAN SENI (STEAM)',
                        'Kokurikuler': 'KATEGORI PENILAIAN KOKURIKULER / DIMENSI PROFIL LULUSAN',
                        'Diniyah': 'LAPORAN PERKEMBANGAN DINIYYAH',
                        'English': 'ENGLISH AS A SECOND LANGUAGE PROGRAM',
                        'Math': 'MATHEMATIC',
                        'Science': 'SCIENCE'
                    };
                    return maps[cat] || cat.toUpperCase();
                },

                isEnglishScale(cat) {
                    return ['English', 'Math', 'Science'].includes(cat);
                },

                getCategoryFullLabel(cat) {
                    const maps = {
                        'Agama': 'Nilai Agama & Budi Pekerti',
                        'Jati Diri': 'Jati Diri',
                        'Literasi & STEAM': 'Dasar Literasi & STEAM',
                        'Kokurikuler': 'Kokurikuler / Dimensi Profil Lulusan',
                        'Diniyah': 'Laporan Perkembangan Diniyyah',
                        'English': 'ESL English Program',
                        'Math': 'Mathematic',
                        'Science': 'Science'
                    };
                    return maps[cat] || cat;
                },

                getIndicatorsFor(cat) {
                    if (!this.dataRapor.iktp) return [];
                    const targetElemen = this.getCategoryFullLabel(cat).trim().toLowerCase();
                    return this.dataRapor.iktp.filter(i => {
                        const itemElemen = String(i.elemen || '').trim().toLowerCase();
                        if (itemElemen !== targetElemen) return false;
                        const sClass = this.siswa.kelas_id || '';
                        const itemKelas = i.kelas || i.tujuan_pembelajaran || '';
                        return !itemKelas || itemKelas.trim() === '' || sClass.toUpperCase().includes(itemKelas.toUpperCase());
                    });
                },

                getRating(idIktp) {
                    if (!this.dataRapor.checklist) return '';
                    const r = this.dataRapor.checklist.find(d => d.id_iktp === idIktp);
                    return r ? r.nilai : '';
                },

                getNarasi(cat) {
                    if (!this.dataRapor.narasi) return null;
                    let n = this.dataRapor.narasi.find(i => i.elemen === cat);
                    if (n) return n.teks_narasi;
                    const firstWord = cat.toLowerCase().split(' ')[0];
                    n = this.dataRapor.narasi.find(i => i.elemen.toLowerCase().includes(firstWord));
                    return n ? n.teks_narasi : null;
                }
            }
        }
    }
</script>
