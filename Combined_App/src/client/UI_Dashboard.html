<!-- UI_Dashboard.html -->
<div class="space-y-6 animate-fade-in" x-data="{
    init() {
        window.addEventListener('dash-data-loaded', (e) => {
            this.renderCharts(e.detail);
        });
        if (dashData && dashData.totalSiswa) {
            this.renderCharts(dashData);
        }
    },
    
    renderCharts(data) {
        // Render Level Chart
        const ctxLevel = document.getElementById('levelChart')?.getContext('2d');
        if (ctxLevel) {
            if (window.levelChartInstance) window.levelChartInstance.destroy();
            window.levelChartInstance = new Chart(ctxLevel, {
                type: 'doughnut',
                data: {
                    labels: ['Playgroup', 'TK A', 'TK B'],
                    datasets: [{
                        data: [data.levelCounts['Playgroup'], data.levelCounts['TK A'], data.levelCounts['TK B']],
                        backgroundColor: ['#34d399', '#10b981', '#047857'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { family: 'Outfit', weight: 'bold' } } }
                    }
                }
            });
        }
        
        // Render Performance Chart
        const ctxRating = document.getElementById('ratingChart')?.getContext('2d');
        if (ctxRating) {
            if (window.ratingChartInstance) window.ratingChartInstance.destroy();
            
            const bb = data.ratingCounts.BB || 0;
            const mb = data.ratingCounts.MB || 0;
            const bsh = data.ratingCounts.BSH || 0;
            const bsb = data.ratingCounts.BSB || 0;
            
            window.ratingChartInstance = new Chart(ctxRating, {
                type: 'bar',
                data: {
                    labels: ['Belum Berkembang (BB)', 'Mulai Berkembang (MB)', 'Sesuai Harapan (BSH)', 'Sangat Baik (BSB)'],
                    datasets: [{
                        label: 'Jumlah Penilaian',
                        data: [bb, mb, bsh, bsb],
                        backgroundColor: ['#ef4444', '#f59e0b', '#3b82f6', '#10b981'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }
    },
    
    getRecommendationText() {
        if (!dashData || !dashData.ratingCounts) return 'Memuat rekomendasi...';
        
        const bb = dashData.ratingCounts.BB || 0;
        const mb = dashData.ratingCounts.MB || 0;
        const bsh = dashData.ratingCounts.BSH || 0;
        const bsb = dashData.ratingCounts.BSB || 0;
        const total = bb + mb + bsh + bsb;
        
        if (total === 0) return 'Belum ada data penilaian perkembangan yang diinput oleh guru.';
        
        const bsbPercent = Math.round((bsb / total) * 100);
        const bbPercent = Math.round((bb / total) * 100);
        
        if (bbPercent > 20) {
            return `Peringatan Perkembangan: Terdapat sekitar ${bbPercent}% indikator siswa yang berada pada skala Belum Berkembang (BB). Yayasan dan Kepala Sekolah disarankan untuk mengadakan evaluasi berkala dengan guru kelas guna memberikan intervensi dini atau pendampingan khusus bagi siswa yang mengalami hambatan belajar.`;
        } else if (bsbPercent > 50) {
            return `Sangat Baik: Mayoritas capaian perkembangan siswa (${bsbPercent}%) berada pada tingkat Berkembang Sangat Baik (BSB). Kualitas pembelajaran sangat baik dan disarankan untuk terus dipertahankan, serta memperbanyak stimulus kreatif di kelas.`;
        } else {
            return `Rekomendasi Umum: Secara keseluruhan, grafik perkembangan siswa berjalan stabil dengan mayoritas berada di tingkat Mulai Berkembang (MB) dan Berkembang Sesuai Harapan (BSH). Disarankan bagi Kepala Sekolah untuk memotivasi para guru meningkatkan stimulasi harian agar lebih banyak siswa meningkat ke skala Berkembang Sangat Baik (BSB).`;
        }
    }
}">

    <!-- Welcome Stats -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-gradient-to-br from-emerald-500 to-emerald-700 p-6 rounded-2xl text-white shadow-lg flex flex-col justify-between">
            <div>
                <h3 class="text-2xl font-black mb-1">Ahlan wa Sahlan</h3>
                <p class="text-xs opacity-90 leading-relaxed">Sistem Rapor AI PG-TK Al-Imam Islamic School siap digunakan.</p>
            </div>
            <div class="mt-4 pt-4 border-t border-white/20 text-[10px] font-bold uppercase tracking-wider">
                Unit Kerja: PG-TK
            </div>
        </div>
        
        <div class="bg-white p-6 rounded-2xl border border-gray-150 shadow-sm flex items-center justify-between">
            <div>
                <p class="text-gray-400 text-xs font-bold uppercase tracking-wider">Total Siswa Aktif</p>
                <p class="text-4xl font-black text-slate-800 mt-1" x-text="dashData.totalSiswa || 0"></p>
            </div>
            <div class="bg-emerald-50 p-4 rounded-2xl text-emerald-600 border border-emerald-100/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                    </path>
                </svg>
            </div>
        </div>

        <div class="bg-white p-6 rounded-2xl border border-gray-150 shadow-sm flex items-center justify-between">
            <div>
                <p class="text-gray-400 text-xs font-bold uppercase tracking-wider">Total Penilaian Terinput</p>
                <p class="text-4xl font-black text-slate-800 mt-1" x-text="Object.values(dashData.ratingCounts).reduce((a, b) => a + b, 0)"></p>
            </div>
            <div class="bg-blue-50 p-4 rounded-2xl text-blue-600 border border-blue-100/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                </svg>
            </div>
        </div>
    </div>

    <!-- Charts Panel -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Chart 1: Siswa Per Level -->
        <div class="bg-white p-6 rounded-2xl border border-gray-150 shadow-sm flex flex-col">
            <h4 class="text-sm font-extrabold text-slate-800 mb-4 uppercase tracking-wider">Distribusi Siswa Per Level</h4>
            <div class="h-64 relative">
                <canvas id="levelChart"></canvas>
            </div>
        </div>

        <!-- Chart 2: Capaian Siswa -->
        <div class="bg-white p-6 rounded-2xl border border-gray-150 shadow-sm flex flex-col">
            <h4 class="text-sm font-extrabold text-slate-800 mb-4 uppercase tracking-wider">Grafik Capaian Perkembangan Siswa (IKTP)</h4>
            <div class="h-64 relative">
                <canvas id="ratingChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Recommendation Box for Kepala Sekolah & Yayasan -->
    <div class="bg-white p-6 rounded-2xl border border-gray-150 shadow-sm">
        <div class="flex items-center gap-3 mb-4">
            <div class="p-2.5 bg-amber-50 text-amber-600 rounded-xl border border-amber-100">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <h4 class="text-sm font-extrabold text-slate-800 uppercase tracking-wider">Rekomendasi Akademik & Perkembangan</h4>
                <p class="text-[10px] text-gray-400 font-bold uppercase">Catatan Analisis untuk Yayasan & Kepala Sekolah</p>
            </div>
        </div>
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-100 text-xs leading-relaxed text-slate-600 font-semibold" x-text="getRecommendationText()"></div>
    </div>

</div>
