<!-- AD_View_Guru.html -->
<div x-data="guruAdmin()">
    <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold">Manajemen Data Guru</h3>
        <button @click="showUpload=true"
            class="bg-indigo-100 text-indigo-700 px-4 py-2 rounded-lg font-medium hover:bg-indigo-200">
            Bulk Upload CSV
        </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Form -->
        <div class="bg-gray-50 p-6 rounded-xl border">
            <h4 class="font-bold mb-4">Tambah / Edit Guru</h4>
            <div class="space-y-4">
                <input type="email" x-model="form.email_kantor" placeholder="Email Kantor (@alimamischool.com)"
                    class="w-full p-2 border rounded">
                <input type="password" x-model="form.password" placeholder="Password" class="w-full p-2 border rounded">
                <input type="text" x-model="form.nama" placeholder="Nama Lengkap" class="w-full p-2 border rounded">
                <select x-model="form.role" class="w-full p-2 border rounded">
                    <option value="Guru">Guru</option>
                    <option value="Admin">Admin</option>
                </select>
                <select x-model="form.unit" class="w-full p-2 border rounded">
                    <option value="TK">Unit PG-TK</option>
                    <option value="ALL">Semua Unit</option>
                </select>
                <button @click="save" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">Simpan
                    Guru</button>
            </div>
        </div>

        <!-- Table -->
        <div class="lg:col-span-2 overflow-x-auto">
            <table class="w-full text-sm text-left border">
                <thead class="bg-gray-50 text-xs uppercase font-bold">
                    <tr>
                        <th class="p-3 border">Email Kantor</th>
                        <th class="p-3 border">Nama</th>
                        <th class="p-3 border">Role</th>
                        <th class="p-3 border">Unit</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="g in listGuru" :key="g.email_kantor">
                        <tr class="hover:bg-gray-50">
                            <td class="p-3 border" x-text="g.email_kantor"></td>
                            <td class="p-3 border" x-text="g.nama"></td>
                            <td class="p-3 border" x-text="g.role"></td>
                            <td class="p-3 border" x-text="g.unit"></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Upload -->
    <div x-show="showUpload" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-xl max-w-md w-full">
            <h3 class="font-bold text-lg mb-4">Bulk Upload Guru</h3>
            <p class="text-xs text-gray-500 mb-4">Format CSV: email_kantor, password, nama, role, unit</p>
            <textarea x-model="csvText" rows="6" class="w-full p-3 border rounded text-xs mb-4"
                placeholder="email1@alimamischool.com,pass1,Nama Guru,Guru,TK"></textarea>
            <div class="flex gap-2">
                <button @click="processUpload"
                    class="flex-1 bg-indigo-600 text-white py-2 rounded font-bold">Upload</button>
                <button @click="showUpload=false" class="flex-1 bg-gray-100 py-2 rounded">Batal</button>
            </div>
        </div>
    </div>
</div>

<script>
    function guruAdmin() {
        return {
            listGuru: [],
            showUpload: false,
            csvText: '',
            form: { email_kantor: '', password: '', nama: '', role: 'Guru', unit: 'TK' },

            init() { this.load(); },

            load() {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.status && res.data) {
                        this.listGuru = res.data;
                    } else {
                        console.error("Failed to load guru:", res);
                    }
                }).apiCall('getGuru');
            },

            save() {
                if (!this.form.email_kantor.endsWith('@alimamischool.com')) {
                    alert("Email harus menggunakan domain @alimamischool.com");
                    return;
                }
                google.script.run.withSuccessHandler(res => {
                    if (res && res.status) {
                        alert("Guru berhasil disimpan");
                        this.load();
                        this.form = { email_kantor: '', password: '', nama: '', role: 'Guru', unit: 'TK' };
                    } else {
                        alert("Gagal menyimpan guru: " + (res ? res.message : "Error tidak diketahui"));
                    }
                }).apiCall('saveGuru', JSON.stringify(this.form));
            },

            processUpload() {
                google.script.run.withSuccessHandler(res => {
                    if (res && res.status) {
                        alert(res.data || "Bulk upload berhasil");
                        this.showUpload = false;
                        this.load();
                        this.csvText = '';
                    } else {
                        alert("Gagal melakukan upload: " + (res ? res.message : "Error tidak diketahui"));
                    }
                }).apiCall('bulkUpload', JSON.stringify({ type: 'GURU', csv: this.csvText }));
            }
        }
    }
</script>
