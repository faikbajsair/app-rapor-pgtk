<style>
    :root {
        --primary: #059669; /* Emerald 600 */
        --primary-light: #10b981; /* Emerald 500 */
        --primary-dark: #047857; /* Emerald 700 */
        --pastel-bg-1: #e0f2fe; /* Soft pastel blue */
        --pastel-bg-2: #dcfce3; /* Soft pastel green */
        --glass-bg: rgba(255, 255, 255, 0.45);
        --glass-border: rgba(255, 255, 255, 0.4);
        --glass-shadow: 0 8px 32px rgba(5, 150, 105, 0.04);
    }

    body {
        font-family: 'Outfit', 'Inter', sans-serif !important;
        background: linear-gradient(135deg, var(--pastel-bg-1), var(--pastel-bg-2)) fixed !important;
        color: #334155;
    }

    /* Glassmorphism Utilities */
    .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow);
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        border-radius: 20px;
    }

    /* Custom scrollbar matching POS AI IS style */
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(5, 150, 105, 0.15);
        border-radius: 20px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
    }

    [x-cloak] {
        display: none !important;
    }

    @media print {
        .no-print {
            display: none !important;
        }

        html, body {
            background: white !important;
            margin: 0 !important;
            padding: 0 !important;
            height: auto !important;
            min-height: auto !important;
            display: block !important;
        }

        /* Reset Tailwind layout wrappers to standard document flow during printing */
        div.flex.h-\[calc\(100vh-2rem\)\],
        body > div {
            display: block !important;
            height: auto !important;
            min-height: auto !important;
            padding: 0 !important;
            margin: 0 !important;
            gap: 0 !important;
            overflow: visible !important;
        }

        /* Reset the page viewport padding and margins */
        div.p-8.flex-1 {
            display: block !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: visible !important;
            height: auto !important;
        }
    }
</style>
